[build]
  publish = "public"
[build.environment]
  NODE_VERSION = "24"
[server]
  path = "/api/*"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
